<div class="d-flex justify-content-between align-items-center mb-4">
  <h2 class="h4 mb-0">
    Welcome, <span class="text-primary">{{ auth.currentUser()?.name }}!</span> to your dashboard
  </h2>
  <button class="btn btn-outline-danger btn-sm" (click)="auth.logout()">Logout</button>
</div>

<div class="card shadow-sm">
  <div class="card-header d-flex justify-content-between align-items-center">
    <span>All Users ({{ users().length }})</span>
    <a class="btn btn-success btn-sm" routerLink="/register">Add</a>
  </div>
  <table class="table table-striped table-hover mb-0">
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Edit</th>
        <th>Delete</th>
      </tr>
    </thead>
    <tbody>
      @for (user of users(); track user.id) {
        <tr>
          <td>{{ user.id }}</td>
          <td>{{ user.name }}</td>
          <td>{{ user.email }}</td>
          <td><a class="btn btn-primary btn-sm" [routerLink]="['/users', user.id, 'edit']">Edit</a></td>
          <td><button type="button" class="btn btn-danger btn-sm" (click)="deleteUser(user)">Delete</button></td>
        </tr>
      } @empty {
        <tr>
          <td colspan="5" class="text-center text-muted">No users found</td>
        </tr>
      }
    </tbody>
  </table>
</div>
